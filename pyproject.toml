[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "outreach-reputation-guard"
version = "0.1.0"
description = "Deterministic local outreach sending guard"
requires-python = ">=3.10"
dependencies = []

[project.scripts]
org = "outreach_reputation_guard.cli:main"

[tool.setuptools.packages.find]
include = ["outreach_reputation_guard*"]
